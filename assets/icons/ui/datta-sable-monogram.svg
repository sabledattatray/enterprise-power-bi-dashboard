<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="dsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- D Loop Gradient (Sapphire / Electric Blue) -->
    <linearGradient id="dsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- S Ribbon Gradient (Cyan to Emerald Growth) -->
    <linearGradient id="dsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#06B6D4"/>
      <stop offset="65%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bar Chart Metric Gradients -->
    <linearGradient id="barA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barC" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#dsBg)" stroke="url(#dsBorder)" stroke-width="1.8" filter="url(#dsShadow)"/>

  <!-- Subtle Radial Ambient Mesh Light -->
  <circle cx="40" cy="40" r="30" fill="#38BDF8" opacity="0.14"/>
  <circle cx="88" cy="88" r="30" fill="#10B981" opacity="0.12"/>

  <!-- Subtle Executive Grid Matrix Accents -->
  <circle cx="22" cy="22" r="1.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="30" cy="22" r="1.5" fill="#38BDF8" opacity="0.25"/>
  <circle cx="22" cy="30" r="1.5" fill="#38BDF8" opacity="0.25"/>

  <!-- Analytics Ascending Tier Bars (Forming the spine of the D) -->
  <rect x="28" y="64" width="7.5" height="30" rx="3.75" fill="url(#barA)"/>
  <rect x="39" y="48" width="7.5" height="46" rx="3.75" fill="url(#barB)"/>
  <rect x="50" y="34" width="7.5" height="60" rx="3.75" fill="url(#barC)"/>

  <!-- Precision "D" Outer Curve (Architectural Monogram Arch) -->
  <path d="M 50 34
           H 74
           C 90 34, 102 46, 102 64
           C 102 82, 90 94, 74 94
           H 50"
        stroke="url(#dsBlue)"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#dsGlow)"/>

  <!-- The "S" Dynamic Analytics Growth Ribbon (Interlocking Curve) -->
  <path d="M 90 44
           C 90 37, 81 33.5, 72 33.5
           C 57 33.5, 54 46, 68 53.5
           C 85 61, 89 69, 89 78
           C 89 89.5, 77 95, 62 95
           C 51 95, 41 89.5, 39 81"
        stroke="url(#dsGreen)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#dsGlow)"/>

  <!-- Executive Insight Diamond (Top-Right Spark) -->
  <path d="M 100 22
           L 102.8 28.5
           L 109.5 31.2
           L 102.8 34
           L 100 40.5
           L 97.2 34
           L 90.5 31.2
           L 97.2 28.5 Z"
        fill="#FFFFFF"
        opacity="0.95"
        filter="url(#dsGlow)"/>

  <!-- Performance Anchor Node -->
  <circle cx="89" cy="78" r="2.8" fill="#34D399" filter="url(#dsGlow)"/>
</svg>