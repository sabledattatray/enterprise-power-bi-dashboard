<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="badgeShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hexagonal Shield Contour -->
  <path d="M 64 6
           L 114 26
           L 114 74
           C 114 96, 92 116, 64 124
           C 36 116, 14 96, 14 74
           L 14 26 Z"
        fill="url(#badgeShield)"
        stroke="url(#goldAccent)"
        stroke-width="2.5"
        filter="url(#badgeShadow)"/>

  <!-- Inner Inset Shield -->
  <path d="M 64 16
           L 104 32
           L 104 70
           C 104 88, 86 104, 64 112
           C 42 104, 24 88, 24 70
           L 24 32 Z"
        stroke="#38BDF8"
        stroke-width="1.2"
        stroke-opacity="0.4"/>

  <!-- Analytics Columns Inside Badge -->
  <rect x="42" y="66" width="8" height="24" rx="4" fill="#3B82F6"/>
  <rect x="54" y="52" width="8" height="38" rx="4" fill="#0D9488"/>
  <rect x="66" y="42" width="8" height="48" rx="4" fill="#10B981"/>
  <rect x="78" y="32" width="8" height="58" rx="4" fill="url(#goldAccent)"/>

  <!-- Upward Trend Line with Node -->
  <path d="M 40 70 L 52 56 L 68 46 L 86 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="32" r="4.5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Star of Excellence at Top -->
  <path d="M 64 24 L 66 28.5 L 71 29.5 L 67.5 33 L 68.5 38 L 64 35.5 L 59.5 38 L 60.5 33 L 57 29.5 L 62 28.5 Z" fill="url(#goldAccent)"/>
</svg>