<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#131D38"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Monogram Mark Container -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="1.5"/>
    <!-- Ascending bars -->
    <rect x="18" y="44" width="5" height="20" rx="2.5" fill="#3B82F6"/>
    <rect x="26" y="32" width="5" height="32" rx="2.5" fill="#14B8A6"/>
    <rect x="34" y="22" width="5" height="42" rx="2.5" fill="#10B981"/>
    <!-- D loop -->
    <path d="M 34 22 H 50 C 62 22, 70 30, 70 43 C 70 56, 62 64, 50 64 H 34" stroke="url(#logoBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- S curve -->
    <path d="M 62 29 C 62 25, 56 22, 50 22 C 40 22, 38 31, 47 36 C 58 41, 61 46, 61 52 C 61 60, 53 64, 43 64 C 36 64, 29 60, 27 55" stroke="url(#logoGreen)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Insight Star -->
    <path d="M 68 14 L 69.8 18.5 L 74.5 20.2 L 69.8 22 L 68 26.5 L 66.2 22 L 61.5 20.2 L 66.2 18.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography: DATTA SABLE -->
  <text x="108" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="url(#textGrad)">DATTA SABLE</text>
  
  <!-- Subtitle: ENTERPRISE ANALYTICS & BI -->
  <text x="109" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2.8" fill="#38BDF8">ENTERPRISE BI &amp; ANALYTICS</text>
  
  <!-- Accent Line -->
  <rect x="109" y="76" width="220" height="2" rx="1" fill="url(#logoBorder)" opacity="0.6"/>
</svg>