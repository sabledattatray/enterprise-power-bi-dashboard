name: Validate Portfolio Assets and Data

on:
  push:
    branches: [ main, 'maintenance/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Validate dataset schemas, integrity, and financials
        run: |
          python scripts/validate_data.py

      - name: Validate image and SVG vector assets
        run: |
          python scripts/validate_assets.py

      - name: Validate markdown documentation links
        run: |
          python scripts/validate_links.py

      - name: Run automated test suite
        run: |
          python -m unittest discover tests

      - name: Generate live validation report
        run: |
          python scripts/generate_validation_report.py

      - name: Validate release package integrity and checksums
        run: |
          python scripts/package_release.py

      - name: Upload validation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: docs/validation-report.md
          if-no-files-found: error
